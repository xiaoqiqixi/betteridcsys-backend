name: Accounts and support
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Every pushed revision receives its own result while maintainers share main.
jobs:
  accounts-mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: accounts_test_only
          MYSQL_DATABASE: aster_accounts_test
        volumes:
          - /var/run/aster-accounts-mysql:/var/run/mysqld
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -paccounts_test_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Permission and contract validators
        working-directory: vps-billing/backend
        run: go test -race -count=1 ./internal/staffaccess ./internal/contracttest ./internal/financeapi
      - name: Real MySQL backend regression including accounts and support
        working-directory: vps-billing/backend
        env:
          ASTER_MYSQL_TEST_DSN: root:accounts_test_only@unix(/var/run/aster-accounts-mysql/mysqld.sock)/aster_accounts_test?parseTime=true
        run: |
          test -S /var/run/aster-accounts-mysql/mysqld.sock
          set -o pipefail
          go vet -mod=readonly ./...
          go test -mod=readonly -race -count=1 -timeout=25m -json ./... | tee account-tests.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = [json.loads(line) for line in Path('account-tests.jsonl').read_text().splitlines()]
          # Packages with no test files emit a package-level skip without Test.
          skipped = [event['Test'] for event in events if event.get('Action') == 'skip' and event.get('Test')]
          passed = [event.get('Test') for event in events if event.get('Action') == 'pass' and event.get('Test')]
          assert not skipped, f'Backend acceptance skipped tests: {skipped}'
          assert len(passed) >= 300, f'Expected full backend acceptance tests, got {len(passed)}'
          print(f'{len(passed)} backend tests passed without skips')
          PY
      - name: Retain account test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: accounts-${{ github.sha }}-${{ github.run_attempt }}
          path: vps-billing/backend/account-tests.jsonl
          if-no-files-found: warn
          retention-days: 7
