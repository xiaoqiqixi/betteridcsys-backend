name: Commerce core
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commerce-mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: commerce_test_only
          MYSQL_DATABASE: aster_commerce_test
        volumes:
          - /var/run/aster-commerce-mysql:/var/run/mysqld
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pcommerce_test_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Vet and verify money, contracts, controller transport and CLI
        working-directory: vps-billing/backend
        run: |
          go vet ./...
          go test -race -count=1 ./internal/commerce ./internal/contracttest ./internal/financeapi ./plugins/server.aster-cloud/internal/controllers ./plugins/server.aster-cloud/controllerapi ./plugins/server.aster-cloud/serviceapi ./cmd/server
      - name: Real MySQL commerce and payment acceptance
        working-directory: vps-billing/backend
        env:
          ASTER_MYSQL_TEST_DSN: root:commerce_test_only@unix(/var/run/aster-commerce-mysql/mysqld.sock)/aster_commerce_test?parseTime=true
        run: |
          test -S /var/run/aster-commerce-mysql/mysqld.sock
          set -o pipefail
          go test -race -count=1 -timeout=18m -json ./internal/billing -run 'Test(MySQL)?(Commerce|Credit|Automation|Payment|Gateway|Cancellation|AuditEventsCurrentFrontendContract|HTTPPerformanceSeedUsesLiveStaffMembershipAndCurrentSchema)' | tee commerce-tests.jsonl
          if grep -qE 'Module-Action-Password!2026|Ephemeral-Service-Password!2026|MODULE-SECRET-CANARY|NEVER-PERSIST-MODULE-SECRET' commerce-tests.jsonl; then
            echo 'Secret canary appeared in commerce logs' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = [json.loads(line) for line in Path('commerce-tests.jsonl').read_text().splitlines()]
          skipped = [event.get('Test') for event in events if event.get('Action') == 'skip']
          passed = [event.get('Test') for event in events if event.get('Action') == 'pass' and event.get('Test')]
          assert not skipped, f'Commerce acceptance skipped tests: {skipped}'
          assert len(passed) >= 20, f'Expected commerce acceptance tests, got {len(passed)}'
          print(f'{len(passed)} commerce/payment tests passed without skips')
          PY
      - name: Retain commerce test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: commerce-${{ github.sha }}-${{ github.run_attempt }}
          path: vps-billing/backend/commerce-tests.jsonl
          if-no-files-found: warn
          retention-days: 7
