name: Server modules
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Protocol, conformance, authenticated sockets and isolated slot policies
        working-directory: vps-billing/backend
        run: |
          go test -race -count=1 ./pkg/pluginapi/... ./pkg/pluginserver ./internal/runtimeplugins ./plugins/server-template ./plugins/server.aster-cloud/...
          go build ./...
          if go list -deps ./cmd/server | grep -E '(^aster/billing/(controllerapi|serviceapi)$|plugins/server[.]aster-cloud|resourcebridge|resourcev1)'; then
            echo 'Finance Core depends on a cloud-specific package' >&2
            exit 1
          fi
      - name: Protected plugin installation and lifecycle regression
        run: |
          python3 -B vps-billing/deploy/scripts/test-plugin-manager.py
          python3 -B vps-billing/backend/plugins/server.aster-cloud/legacy/scripts/test-resource-manager.py
  cloud-main-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: module_test_only
          MYSQL_DATABASE: aster_mod_bootstrap_test
        volumes:
          - /var/run/aster-module-mysql:/var/run/mysqld
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pmodule_test_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build actual cloud main with its fake node runner
        run: |
          git clone --depth 1 https://github.com/xiaoqiqixi/betteridcsys-cloud.git artifacts/mod-cloud
          bash vps-billing/deploy/ci/server-modules/build.sh
      - name: Paid order, active service, power cycle and distinct worker credentials
        run: sudo --preserve-env=GITHUB_ACTIONS python3 -B vps-billing/deploy/ci/server-modules/smoke.py
      - name: Retain exact cloud commit and nonsecret smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: server-module-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/mod-cloud-commit.txt
            artifacts/mod-smoke/
          retention-days: 7
          if-no-files-found: error
