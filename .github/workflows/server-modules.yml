name: Server modules
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Protocol, conformance, authenticated sockets and isolated slot policies
        working-directory: vps-billing/backend
        run: |
          go test -race -count=1 ./pkg/pluginapi/... ./pkg/pluginserver ./internal/runtimeplugins ./plugins/server-template ./plugins/server.aster-cloud/...
          go build ./...
      - name: Protected plugin installation and lifecycle regression
        run: python3 -B vps-billing/deploy/scripts/test-plugin-manager.py
